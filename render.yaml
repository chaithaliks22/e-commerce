services:
  # ==========================================
  # 1. Express Backend Web Service
  # ==========================================
  - type: web
    name: shopsphere-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true

  # ==========================================
  # 2. React Vite Frontend Static Site
  # ==========================================
  - type: web
    name: shopsphere-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm run build
    staticPublishPath: dist
    routes:
      # React Router client-side routing fallback
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
